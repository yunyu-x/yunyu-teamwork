stages:
  - lint
  - test
  - verify

default:
  image: node:22-bookworm-slim

syntax_check:
  stage: lint
  script:
    - npm run check

unit_and_integration_tests:
  stage: test
  before_script:
    - apt-get update -qq && apt-get install -y -qq git >/dev/null
  script:
    - npm test

ownership_and_demo_smoke:
  stage: verify
  before_script:
    - apt-get update -qq && apt-get install -y -qq git >/dev/null
  script:
    - node bin/yunyu.mjs demo --once --port 0
